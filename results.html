<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>*{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><script>window.MODE="present";</script>
<title>Live Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one reading-room card per round on the phone; results.html = projector console with tallies. Deliberately single dark theme (MRI reading room). */
:root{
  --bg:#0d1014; --panel:#161b22; --line:#2a313b; --fg:#e8ecf1; --mute:#93a0b0;
  --ruler:#ffd23f; --map:#ff7a45; --edge:#78ffc8; --ok:#4cd68a; --bad:#ff5a64;
  --f-disp:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-num);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--f-disp);font-weight:700;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.mute{color:var(--mute)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
figure img{width:100%;aspect-ratio:1;image-rendering:pixelated;border-radius:6px;border:1px solid var(--line);display:block}
figcaption{font-family:var(--f-num);font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.big{font-family:var(--f-num);font-weight:600;font-size:clamp(40px,13vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pill{font-family:var(--f-num);font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.amb{color:var(--ruler)}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.votes button{font:600 15px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 6px;cursor:pointer}
.votes button[aria-pressed="true"]{border-color:var(--fg);background:#232b36}
.votes button:focus-visible,.next:focus-visible,input:focus-visible{outline:2px solid var(--edge);outline-offset:2px}
.next{font:700 16px var(--f-disp);background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:14px;cursor:pointer}
.next:disabled{opacity:.35;cursor:default}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.slider{display:flex;flex-direction:column;gap:4px}
.slider label{display:flex;justify-content:space-between;font-size:14px}
.slider output{font-family:var(--f-num);color:var(--edge)}
input[type=range]{width:100%;accent-color:var(--edge)}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:11px;color:var(--mute)}
.bar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad) 0 34%,var(--ok) 34% 100%);opacity:.85}
.bar i{position:absolute;top:-5px;width:3px;height:20px;background:var(--fg);border-radius:2px;transition:left .25s}
.small{font-size:13px}
.src{font-size:12px;color:var(--mute)}
.ruler-key{color:var(--ruler)} .map-key{color:var(--map)} .edge-key{color:var(--edge)}
.progress{display:flex;gap:6px}
.progress span{flex:1;height:3px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--fg)}
/* presenter */
.present .wrap{max-width:1200px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tally{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:7.5em 1fr 2.5em;gap:8px;align-items:center;font-size:14px}
.trow .t{height:14px;border-radius:3px;background:var(--line);overflow:hidden}
.trow .t b{display:block;height:100%;background:var(--fg);transition:width .3s}
.trow .n{font-family:var(--f-num);text-align:right}
.present figure img{max-width:340px}
.linkbtn{font:inherit;color:var(--fg);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
@media (max-width:820px){.pgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const TH = 20; // responder threshold on Ktrans change (%), from this cohort: 21/22 correctly separated
const S = {step:0, v:[null,null,null], b:0, f:0, moved:false};
const app = document.getElementById('app');
const fmt = x => (x>0?'+':'') + x.toFixed(0) + '%';
const change = (b,f) => D.grid[b+','+f];
const verdict = c => c > TH ? ['Responding','ok'] : ['Not responding','bad'];
const OPTS = [['yes','Working'],['unsure','Can’t tell'],['no','Not working']];

function voteRow(i){
  return `<div class="votes" role="group" aria-label="Your call">${OPTS.map(([k,l])=>
    `<button type="button" data-v="${i}" data-k="${k}" aria-pressed="${S.v[i]===k}">${l}</button>`).join('')}</div>`;
}
function prog(){return `<div class="progress">${[0,1,2,3,4].map(i=>`<span class="${i<=S.step?'on':''}"></span>`).join('')}</div>`}

const STEPS = [
 () => `${prog()}
  <div class="eyebrow"><span>Tumor board · 60 seconds</span><span>Real patient</span></div>
  <h1>You decide whether the chemotherapy is working.</h1>
  <p>A patient with pancreatic cancer has had neoadjuvant chemotherapy. You will see the same tumor three ways, the way the evidence actually reaches a tumor board. After each one, make the call.</p>
  <p class="src">De-identified case from a multi-site DCE-MRI study of pancreatic cancer (UAB cohort). No medical training needed.</p>
  <button class="next" data-go="1">Start</button>`,

 () => `${prog()}
  <div class="eyebrow"><span class="ruler-key">Round 1 · The ruler</span><span>Standard of care</span></div>
  <h2>A radiologist measures the longest line across the tumor, before and after.</h2>
  <div class="pair">
    <figure><img src="${D.ruler[0]}" alt="Baseline slice with a yellow line across the tumor"><figcaption><span>Before</span><span>${D.diam[0].toFixed(1)} vx</span></figcaption></figure>
    <figure><img src="${D.ruler[1]}" alt="Follow-up slice with a shorter yellow line"><figcaption><span>After</span><span>${D.diam[1].toFixed(1)} vx</span></figcaption></figure>
  </div>
  <div class="stat"><span class="big ruler-key">−22%</span><span class="pill amb">RECIST: stable disease</span></div>
  <p class="small mute">RECIST calls a response only when the line shrinks by 30% or more. Pancreatic tumors are often surrounded by scar and inflammation, so they rarely shrink much even when the drugs work.</p>
  <p><b>Is the treatment working?</b></p>${voteRow(0)}
  <button class="next" data-go="2" ${S.v[0]?'':'disabled'}>Next: the map</button>`,

 () => `${prog()}
  <div class="eyebrow"><span class="map-key">Round 2 · The map</span><span>Quantitative MRI</span></div>
  <h2>Now the same tumor on a K<sup>trans</sup> map: how freely blood leaks into the tissue, voxel by voxel.</h2>
  <div class="pair">
    <figure><img src="${D.mapB['0']}" alt="Baseline Ktrans map, tumor outlined"><figcaption><span>Before</span><span>${D.means.b0.toFixed(3)}</span></figcaption></figure>
    <figure><img src="${D.mapF['0']}" alt="Follow-up Ktrans map, tumor outlined"><figcaption><span>After</span><span>${D.means.f0.toFixed(3)}</span></figcaption></figure>
  </div>
  <div class="stat"><span class="big map-key">${fmt(change(0,0))}</span><span class="pill ok">Above the +20% line</span></div>
  <p class="small mute">Mean K<sup>trans</sup> inside the outline, min<sup>−1</sup>. In this study, a rise of more than 20% separated responders from non-responders in 21 of 22 patients. The tumor barely shrank, but its blood supply changed.</p>
  <p><b>Is the treatment working?</b></p>${voteRow(1)}
  <button class="next" data-go="3" ${S.v[1]?'':'disabled'}>Next: the line underneath</button>`,

 () => { const c=change(S.b,S.f), [vt,cls]=verdict(c), pos=Math.max(0,Math.min(100,(c+20)/100*100*1));
   return `${prog()}
  <div class="eyebrow"><span class="edge-key">Round 3 · The line underneath</span><span>One voxel</span></div>
  <h2>That number was averaged inside a green outline someone drew by hand. Nudge it.</h2>
  <div class="pair">
    <figure><img src="${D.mapB[String(S.b)]}" alt="Baseline map with adjustable outline"><figcaption><span>Before</span><span>${D.means['b'+S.b].toFixed(3)}</span></figcaption></figure>
    <figure><img src="${D.mapF[String(S.f)]}" alt="Follow-up map with adjustable outline"><figcaption><span>After</span><span>${D.means['f'+S.f].toFixed(3)}</span></figcaption></figure>
  </div>
  <div class="box">
    ${sl('b','Before outline',S.b)}${sl('f','After outline',S.f)}
    <div class="stat"><span class="big" style="color:var(--${cls})">${fmt(c)}</span><span class="pill ${cls}">${vt}</span></div>
    <div class="bar" aria-hidden="true"><i style="left:calc(${pos}% - 1px)"></i></div>
    <div class="ticks"><span>−20%</span><span>+20% cut</span><span>+80%</span></div>
  </div>
  <p class="small mute">Each step moves the outline in or out by one voxel, about the width of a pencil line on the screen. Two careful readers routinely disagree by more than this.</p>
  <p><b>After moving the line, is the treatment working?</b></p>${voteRow(2)}
  <button class="next" data-go="4" ${S.v[2]?'':'disabled'}>See what happened</button>`; },

 () => `${prog()}
  <div class="eyebrow"><span>Outcome</span><span>Ground truth</span></div>
  <h1>This patient was responding.</h1>
  <p>The study’s reference outcome for this patient is <b>partial response</b>. The ruler missed it. The map caught it. But the map’s answer swung from <b>${fmt(Math.min(...Object.values(D.grid)))}</b> to <b>${fmt(Math.max(...Object.values(D.grid)))}</b> depending on where two lines were drawn, and one voxel on each line was enough to cross the cut.</p>
  <div class="box">
    <div class="trow"><span>Ruler</span><span class="mute">−22% · stable disease</span><span></span></div>
    <div class="trow"><span>Map</span><span class="mute">${fmt(change(0,0))} · responding</span><span></span></div>
    <div class="trow"><span>1 voxel</span><span class="mute">${fmt(change(1,-1))} · not responding</span><span></span></div>
  </div>
  <p><b>The biology was measurable. The outline was the weak link.</b> My dissertation is about drawing that outline reliably, with as little human effort as possible.</p>
  <p class="small mute">Your answers: ${S.v.map((x,i)=>['Ruler','Map','Line'][i]+': '+(OPTS.find(o=>o[0]===x)||['','—'])[1]).join(' · ')}</p>
  <p class="small mute">Please look up. The talk continues on the screen.</p>`
];
function sl(k,label,val){
  return `<div class="slider"><label for="s${k}"><span>${label}</span><output>${val>0?'+':''}${val} vx ${val===0?'(as drawn)':val>0?'(outward)':'(inward)'}</output></label>
  <input id="s${k}" type="range" min="-2" max="2" step="1" value="${val}" data-s="${k}" aria-label="${label} offset in voxels">
  <div class="ticks"><span>−2 in</span><span>−1</span><span>drawn</span><span>+1</span><span>+2 out</span></div></div>`;
}

/* ---------- live votes: anonymous relay via ntfy.sh (no accounts, no names) ---------- */
const TOPIC='ck-defense-rulermap-q7v2x9';
const RELAY='https://ntfy.sh/'+TOPIC;
const PRESENT = window.MODE==='present';
let VID=''; try{VID=localStorage.getItem('rm_vid')||'';}catch(e){}
if(!VID){VID=Math.random().toString(36).slice(2,10); try{localStorage.setItem('rm_vid',VID);}catch(e){}}
let shareT=null;
function share(){
  if(PRESENT) return;
  clearTimeout(shareT);
  shareT=setTimeout(()=>{ fetch(RELAY,{method:'POST',body:JSON.stringify({id:VID,s:S.step,v:S.v,b:S.b,f:S.f})}).catch(()=>{}); },600);
}
function render(){
  const ae=document.activeElement, keep=ae&&ae.id;
  app.innerHTML=STEPS[S.step]();
  if(keep){const el=document.getElementById(keep); if(el) el.focus();}
}
app.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]'); if(v){S.v[+v.dataset.v]=v.dataset.k; render(); share(); return;}
  const g=e.target.closest('[data-go]'); if(g && !g.disabled){S.step=+g.dataset.go; render(); share(); window.scrollTo(0,0);}
});
app.addEventListener('input',e=>{
  const s=e.target.closest('[data-s]'); if(!s) return;
  S[s.dataset.s]=+s.value; S.moved=true; render(); share();
});


/* ---------- presenter: live results ---------- */
const peers=new Map(); let live='connecting';
function tallyHTML(i,title,color){
  const cnt={yes:0,unsure:0,no:0}; let n=0;
  peers.forEach(p=>{const x=p&&p.v&&p.v[i]; if(cnt[x]!==undefined){cnt[x]++;n++;}});
  return `<div class="box"><div class="eyebrow"><span style="color:var(--${color})">${title}</span><span>${n} votes</span></div>
  <div class="tally">${OPTS.map(([k,l])=>`<div class="trow"><span>${l}</span><span class="t"><b style="width:${n?cnt[k]/n*100:0}%"></b></span><span class="n">${cnt[k]}</span></div>`).join('')}</div></div>`;
}
function renderPresent(){
  document.body.classList.add('present');
  const c=change(S.b,S.f),[vt,cls]=verdict(c);
  const flipped=[...peers.values()].filter(p=>p&&(p.b||p.f)).length;
  const status= live==='on' ? `${peers.size} ${peers.size===1?'person':'people'} joined` : live==='connecting' ? 'Connecting…' : 'Live results offline: ask for a show of hands';
  app.innerHTML=`<div class="eyebrow"><span>Live results · The Ruler and the Map</span><span>${status} · <button type="button" id="reset" class="linkbtn">Clear votes</button></span></div>
  <h1>Is the chemotherapy working?</h1>
  <div class="pgrid">${tallyHTML(0,'Round 1 · Ruler','ruler')}${tallyHTML(1,'Round 2 · Map','map')}${tallyHTML(2,'Round 3 · Line','edge')}</div>
  <div class="pgrid">
    <figure><img src="${D.mapB[String(S.b)]}" alt="Baseline map"><figcaption><span>Before</span><span>${D.means['b'+S.b].toFixed(3)} min⁻¹</span></figcaption></figure>
    <figure><img src="${D.mapF[String(S.f)]}" alt="Follow-up map"><figcaption><span>After</span><span>${D.means['f'+S.f].toFixed(3)} min⁻¹</span></figcaption></figure>
    <div class="box">${sl('b','Before outline',S.b)}${sl('f','After outline',S.f)}
      <div class="stat"><span class="big" style="color:var(--${cls})">${fmt(c)}</span><span class="pill ${cls}">${vt}</span></div>
      <p class="small mute">${flipped} of ${peers.size} moved a line. RECIST on the same tumor: −22%, stable disease. Reference outcome: partial response.</p></div>
  </div>`;
}
if(PRESENT){
  render=function(){const ae=document.activeElement,keep=ae&&ae.id; renderPresent(); if(keep){const el=document.getElementById(keep); if(el) el.focus();}};
  let since='4h'; try{since=localStorage.getItem('rm_since')||'4h';}catch(e){}
  let es=null;
  const connect=()=>{
    if(es) es.close(); peers.clear(); live='connecting'; render();
    try{ es=new EventSource(RELAY+'/sse?since='+encodeURIComponent(since)); }catch(e){ live='off'; render(); return; }
    es.onopen=()=>{live='on'; render();};
    es.onerror=()=>{ if(es.readyState===2){live='off'; render();} };
    es.addEventListener('message',ev=>{
      try{ const j=JSON.parse(ev.data); if(j.event&&j.event!=='message') return;
        const m=JSON.parse(j.message); if(!m||typeof m.id!=='string'||!Array.isArray(m.v)) return;
        const ok=k=>['yes','unsure','no',null].includes(k);
        if(!m.v.every(ok)) return;
        peers.set(m.id.slice(0,12),{v:m.v.slice(0,3),b:+m.b||0,f:+m.f||0}); live='on'; render();
      }catch(e){}
    });
  };
  app.addEventListener('click',e=>{ if(e.target.id==='reset'){ since=String(Math.floor(Date.now()/1000)); try{localStorage.setItem('rm_since',since);}catch(err){} connect(); } });
  connect();
} else render();
</script>
</body></html>
